[workspace]
members = ["crates/envlt-core", "crates/envlt-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/obsidia-systems/envlt"
rust-version = "1.95"
version = "0.4.0"

[workspace.dependencies]
age = "0.10"
anyhow = "1"
assert_cmd = "2"
base64 = "0.21"
comfy-table = "=7.1.4"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "5"
fs4 = { version = "1", default-features = false, features = ["sync"] }
keyring = "4"
predicates = "3"
rand = "0.8"
rpassword = "=7.4.0"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
